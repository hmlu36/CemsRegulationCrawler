	<script type="text/javascript">
		function format ( d ) {
    return '<br>'+
        '<td colspan="3">' + 
        '<div class="row">' + 
        '<div class="col-sm-8">' +
        '<h3>'+d[1]+' <small>('+d[2]+')</small></h3>'+
        '</div></div>' + 
        '<div class="row">'+
        '<div class="col-sm-12">'+
        '<h5>Address</h5><p>'+d[4]+'</p>'+
        '</div></div>' + 
        '<div class="row">'+
        '<div class="col-sm-3">'+
        '<h5>Telephone</h5><p>'+d[5]+'</p>'+
        '</div>'+
        '<div class="col-sm-3">'+
        '<h5>Fax</h5><p>'+d[6]+'</p></div>'+
        '<div class="col-sm-3"><h5>Email</h5><p>'+d[8]+'</p></div>'+
        '<div class="col-sm-3"><h5>Website</h5><p>'+d[7]+'</p></div></div>'+
        '<div class="row"><div class="col-sm-4"></div></div></td>';
}
 
$(document).ready(function() {
    var dt = $('#table_id').DataTable( {
        "processing": true,
        //"serverSide": true,
        "ajax": {
            url: "https://cems-legacy.doe.gov.my/cems_consultant/index.php/consultant/get",
            type: 'GET'
        },
        "columns": [
            {},
            {
                "class":          "details-control",
                "orderable":      false,
                "data":           null,
                "defaultContent": ""
            },
            { "data": 1 },
            { "data": 4 },
            { "data": 3 },
            
        ],
        "order": [[1, 'asc']]
    } );
 
    // Array to track the ids of the details displayed rows
    var detailRows = [];
 
    $('#table_id tbody').on( 'click', 'tr td.details-control', function () {
        var tr = $(this).closest('tr');
        var row = dt.row( tr );
        var idx = $.inArray( tr.attr('id'), detailRows );
 
        if ( row.child.isShown() ) {
            tr.removeClass( 'details' );
            row.child.hide();
 
            // Remove from the 'open' array
            detailRows.splice( idx, 1 );
        }
        else {
            tr.addClass( 'details' );
            row.child( format( row.data() ) ).show();
 
            // Add to the 'open' array
            if ( idx === -1 ) {
                detailRows.push( tr.attr('id') );
            }
        }
    } );
 
    // On each draw, loop over the `detailRows` array and show any child rows
    dt.on( 'draw', function () {
        $.each( detailRows, function ( i, id ) {
            $('#'+id+' td.details-control').trigger( 'click' );
        } );
    } );

    dt.on( 'order.dt search.dt', function () {
        dt.column(0, {search:'applied', order:'applied'}).nodes().each( function (cell, i) {
            cell.innerHTML = i+1;
        } );
    } ).draw();
} );
</script>
